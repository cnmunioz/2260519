name: Ejemplo de CI - SpringBoot
on:
    push:
        branches: [main]
    pull_request:
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonando mi respositorio
        uses: actions/checkout@v3
      - name: Configurando JDK 25
        uses: actions/setup-java@v5.2.0
        with:
            java-version: '25'
            distribution: 'temurin'
      - name: Compilando mediante Maven
        run: mvn clean install
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      - name: Verificar inicio de app Spring Boot
        run: mvn verify
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      - name: Iniciar Spring Boot en background
        run: |
          java -jar target/*.jar --spring.profiles.active=dev &
          echo $! > springboot.pid
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      - name: Esperar y probar
        run: |
          sleep 10
          curl -i http://localhost:8080/hola2
      - name: Detener app StringBoot
        run: kill -9 $(cat springboot.pid)