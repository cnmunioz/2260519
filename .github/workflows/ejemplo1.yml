name: Ejemplo de CI - SpringBoot
on:
    push:
        branches: [main]
    pull_request:
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonando mi respositorio
        uses: actions/checkout@v3
      - name: Configurando JDK 25
        uses: actions/setup-java@v5.2.0
        with:
            java-version: '25'
            distribution: 'temurin'
      - name: Compilando mediante Maven
        run: mvn clean install
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      - name: Verificar inicio de app Spring Boot
        run: mvn verify
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
